    <rect x="6" y="8" width="20" height="2" fill="#fff"/>
    <rect x="15" y="8" width="2" height="16" fill="#fff"/>
    <rect x="7" y="13" width="6" height="2" fill="#5cc3dc"/>
    <rect x="7" y="17" width="6" height="2" fill="#5cc3dc"/>
    <rect x="19" y="13" width="6" height="2" fill="#5cc3dc"/>
    <rect x="19" y="17" width="6" height="2" fill="#5cc3dc"/>
    <rect x="7" y="21" width="6" height="1" fill="#fff"/>
    <rect x="19" y="21" width="6" height="1" fill="#fff"/>
  </g>
</svg>
