    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{% csrf_token %}">
    <meta name="referrer" content="same-origin">
    <meta name="theme-color" content="#0f5d70" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1719" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="{% asset 'connect/brand/favicon.ico' %}" sizes="32x32">
    <link rel="icon" href="{% asset 'connect/brand/favicon.svg' %}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{% asset 'connect/brand/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% asset 'connect/brand/manifest.webmanifest' %}">
    <link rel="stylesheet" href="{% asset 'connect/css/fonts.css' %}">
    <link rel="stylesheet" href="{% asset 'connect/css/bulma.min.css' %}">
    <link rel="stylesheet" href="{% asset 'connect/css/theme.css' %}">
    <link rel="stylesheet" href="{% asset 'connect/css/connect.css' %}">
    <script src="{% asset 'connect/js/passkey.js' %}" defer></script>
    <script src="{% asset 'connect/js/copy.js' %}" defer></script>
