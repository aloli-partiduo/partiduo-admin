name: partiduo-admin
version: 0.1.4

description: |
  Administration du parc de dossiers Partiduo (ADR-008) : cabinets,
  utilisateurs d'administration, donneurs d'ordre, inventaire des dossiers
  et de leur paquet, serveurs, file de tâches, sauvegardes, supervision et
  journal d'audit ; exécutant `partiduo-agent` installé sur chaque serveur. Aucun
  accès aux données comptables des dossiers (ADR-008 D3).

authors:
  - Philippe Nénert <it+claude.ai@aloli.fr>

crystal: ">= 1.19.1"

license: AGPL-3.0-or-later

targets:
  partiduo-admin:
    main: src/server.cr
  partiduo-admin-manage:
    main: manage.cr
  partiduo-agent:
    main: src/agent.cr

dependencies:
  marten:
    github: aloli-crystal/marten
    branch: production
  pg:
    github: will/crystal-pg
  # Shards maison sur GitHub (ADR-002) ; en local, scripts/override-local.sh.
  authn:
    github: aloli-crystal/authn
    branch: production
  password-policy:
    github: aloli-crystal/password-policy
    version: "~> 0.1"
  totp:
    github: aloli-crystal/totp
    branch: production
  webauthn:
    github: aloli-crystal/webauthn
    branch: production
  jose:
    github: aloli-crystal/jose
    version: "~> 0.2"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
