name: partiduo-admin
version: 0.1.46

description: |
  Administration du parc de dossiers Partiduo (ADR-008) : cabinets,
  utilisateurs d'administration, donneurs d'ordre, inventaire des dossiers
  et de leur paquet, serveurs, file de tâches, sauvegardes, supervision et
  journal d'audit ; exécutant `partiduo-agent` installé sur chaque serveur. Aucun
  accès aux données comptables des dossiers (ADR-008 D3).

authors:
  - Philippe Nénert <philippe@aloli.fr>

crystal: ">= 1.19.1"

license: AGPL-3.0-or-later

targets:
  partiduo-admin:
    main: src/server.cr
  partiduo-admin-manage:
    main: manage.cr
  partiduo-agent:
    main: src/agent.cr
  # Fournisseur d'identité commun aux dossiers (ADR-012), déployé à part.
  partiduo-connect:
    main: src/connect.cr
  partiduo-connect-manage:
    main: connect_manage.cr

dependencies:
  marten:
    github: aloli-crystal/marten
    branch: production
  # Courriels par SMTP (administration et invitations de l'exécutant), sans
  # sendmail ni relais du serveur.
  marten-mail:
    github: aloli-crystal/marten-mail
    branch: production
  pg:
    github: will/crystal-pg
  # Shards maison sur GitHub (ADR-002) ; en local, scripts/override-local.sh.
  authn:
    github: aloli-crystal/authn
    branch: production
  password-policy:
    github: aloli-crystal/password-policy
    version: "~> 0.1"
  totp:
    github: aloli-crystal/totp
    branch: production
  webauthn:
    github: aloli-crystal/webauthn
    branch: production
  jose:
    github: aloli-crystal/jose
    version: "~> 0.2.1"
  # DNS des dossiers (ADR-013) : enregistrements de la zone chez OVH, posés
  # par l'administration seule.
  api-ovh:
    github: aloli-crystal/api-ovh
    version: "~> 0.7.4"
  # Format des sauvegardes (chiffrement, capsules, manifeste signé,
  # stockage), partagé avec la commande partiduo de partiduo-dist.
  partiduo-backup:
    github: aloli-partiduo/partiduo-backup
    branch: development

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.7"
