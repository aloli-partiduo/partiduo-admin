# SPDX-License-Identifier: AGPL-3.0-or-later
#
# CI de partiduo-admin : format, Ameba, compilation des cinq binaires
# (administration et sa ligne de commande, exécutant, connect et sa ligne de
# commande), specs sur PostgreSQL (administration, puis connect à part).
name: CI

on:
  push:
    branches: [development, production]
  pull_request:

env:
  CRYSTAL_VERSION: "1.19.1"
  SKIP_MARTEN_CLI_PRECOMPILATION: "1"

jobs:
  qualite:
    name: Format, Ameba
    runs-on: ubuntu-latest
    container: crystallang/crystal:1.19.1
    steps:
      - uses: actions/checkout@v4
      - name: Verrou sans dépendance « path » (exigé par les ports FreeBSD)
        run: "! grep -q 'path:' shard.lock"
      - name: Format
        run: crystal tool format --check src spec spec-connect config scripts manage.cr connect_manage.cr
      - name: Aucune mention du logiciel d'origine hors documentation
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git grep -il 'noal[y]ss' -- . ':!*.adoc' ':!*.md'; then
            echo "Mention interdite trouvée dans les fichiers ci-dessus." >&2
            exit 1
          fi
      - name: Shards
        run: shards install
      - name: Ameba
        run: mkdir -p bin && crystal build lib/ameba/bin/ameba.cr -o bin/ameba && bin/ameba

  specs:
    name: Compilation et specs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: partiduo
          POSTGRES_PASSWORD: partiduo
          POSTGRES_DB: partiduo_admin_test
        options: >-
          --health-cmd "pg_isready -U partiduo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # En CI seulement, PostgreSQL est un service joignable en TCP.
      DATABASE_URL: postgres://partiduo:partiduo@localhost:5432/partiduo_admin_test
      PGHOST: localhost
      PGUSER: partiduo
      PGPASSWORD: partiduo
    steps:
      - uses: actions/checkout@v4
      - name: Mémoire d'échange (la compilation des specs dépasse 6 Go)
        run: |
          sudo fallocate -l 12G /swap-ci && sudo chmod 600 /swap-ci
          sudo mkswap /swap-ci && sudo swapon /swap-ci && free -h
      - name: Index des paquets à jour (install-crystal installe sans le rafraîchir)
        run: sudo apt-get update
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.19.1
      - name: Bibliothèques de compilation et outils PostgreSQL
        # pg_dump refuse un serveur plus récent que lui : les outils clients
        # doivent être en version 18 comme le service (dépôt PGDG).
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends libyaml-dev libssl-dev libgmp-dev libxml2-dev libpcre2-dev lld postgresql-client-18
          pg_dump --version
      - name: age 1.3 (sauvegardes post-quantiques, D-CHF-013 ; le paquet d'Ubuntu est trop ancien)
        run: |
          curl -sSfL -o /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  /tmp/age.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/age.tar.gz -C /usr/local/bin --strip-components=1 age/age age/age-keygen age/age-inspect
          age --version
      - name: Shards
        run: shards install
      - name: Compilation (partiduo-admin, partiduo-admin-manage, partiduo-agent, partiduo-connect, partiduo-connect-manage)
        run: shards build --no-debug --link-flags=-fuse-ld=lld
      - name: Specs de l'administration
        run: crystal spec --order random --no-debug --threads 1 --link-flags=-fuse-ld=lld
      - name: Specs de connect (ADR-012), sur leur propre base
        env:
          DATABASE_URL: postgres://partiduo:partiduo@localhost:5432/partiduo_connect_test
        run: |
          createdb partiduo_connect_test
          crystal spec spec-connect --order random --no-debug --threads 1 --link-flags=-fuse-ld=lld
